name: sim-preview

# breakout 视觉验收：官方 Lite Simulator（真机同款引擎）+ hmlwsim 网页道双渲染。
# 独立 public 仓跑（public macOS runner 免费；私有仓 macOS 会被 3 秒取消）。
# 官方二进制经只读 deploy key 从私有 deveco-sim-ci 拉取，不入库；hmlwsim 运行时拉取不分发。

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sim:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: 检出本仓（含 built/*.app）
        uses: actions/checkout@v4

      - name: 确认 .app 存在
        run: |
          ls -la built/
          test -n "$(find built -name '*.app' -print -quit)" || { echo "NO .app FOUND"; exit 1; }

      - name: 检出模拟器驱动（私有仓，deploy key 只读）
        uses: actions/checkout@v4
        with:
          repository: lantianhcgp/deveco-sim-ci
          ssh-key: ${{ secrets.SIM_CI_SSH_KEY }}
          path: _sim

      - name: 解包 .app → bundle
        id: unpack
        run: |
          chmod +x _sim/sdk/openharmony/previewer/liteWearable/bin/Simulator || true
          python3 _sim/unpack_app.py built _sim/apps

      - name: 官方 Simulator 渲染采集
        working-directory: _sim
        env:
          CAPTURE_APPS: ${{ steps.unpack.outputs.apps }}
        run: |
          python3 -m pip install --quiet pillow 2>/dev/null || \
            python3 -m pip install --quiet --user pillow 2>/dev/null || \
            python3 -m pip install --quiet --break-system-packages pillow
          python3 capture.py

      - name: 检出 hmlwsim（朋友的网页模拟器）
        uses: actions/checkout@v4
        with:
          repository: kqakqakqa/hmlwsim
          path: _hmlwsim

      - name: hmlwsim 第二道渲染
        working-directory: _sim
        run: |
          python3 simweb/render.py --built-dir ../built --web-dir ../_hmlwsim \
            --out-dir frames/web \
            --chrome "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

      - name: 上传截图 + 判定 + 引擎日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-preview
          path: |
            _sim/frames/**
            _sim/results.json
          if-no-files-found: warn
